name: OSINT-Command-Search
on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Target Identifier'
        required: true
        default: 'theosintvault'

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository
        uses: actions/checkout@v4

      - name: Hardened Python Environment
        uses: actions/setup-python@v5 # Updated to v5 to fix Node 20 warning
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Execute Pivot Engine
        run: |
          # The script must exist in the root as 'core_crawler.py'
          python core_crawler.py "${{ github.event.inputs.username }}"
