name: OSINT-Command-Search
on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Target Identifier'
        required: true
        default: 'theosintvault'

env:
  # This kills the Node 20 warning by forcing the newer engine
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Repository
        uses: actions/checkout@v4

      - name: Hardened Python Environment
        uses: actions/setup-python@v5  # Updated version to support Node 24
        with:
          python-version: '3.12'

      - name: Install Core Modules
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Execute Pivot Engine
        run: |
          # The 'set -e' ensures the workflow stops immediately if the script fails
          set -e
          python core_crawler.py "${{ github.event.inputs.username }}"
